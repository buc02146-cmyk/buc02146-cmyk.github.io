"age":["6-12m","12-24m","24m+"],"desc":"싱가포르에서 구할 수 있는 무염버터 후보예요. 포장에 Unsalted 표시가 있는지 확인해 주세요.","review":"무염 제품을 골라 사용하는 경험이 공유됐어요. 이 브랜드 자체의 실사용 평가는 충분하지 않아요.","warning":"이 카드는 커뮤니티 구매 흐름과 로컬 마트 접근성을 합쳐 정리한 참고 카드입니다.","photo":"https://littlefarms.com/media/catalog/product/3/0/300697-01-lurpak-butter-unsalted-1000x1000.jpg?canvas=500%3A500&fit=bounds&height=500&optimize=medium&width=500","icon":"🧈","url":"https://littlefarms.com/lurpak-butter-unsalted-300697","type":"product"},{"title":"질마재 유기농 현미귀리 스틱","category":"grocery","sub":"떡뻥·간식","age":["6-12m","12-24m"],"desc":"싱가포르 ToppingsKids에서 판매되는 질마재농장 유기농 현미귀리 스틱이에요. 한국 아기 간식 구매처로 언급된 곳에서 찾을 수 있어요.","review":"ToppingsKids에서 질마재 제품을 구할 수 있다는 구매 정보가 공유됐어요. 이 세부 제품의 맛·식감에 대한 직접 후기는 확인되지 않았어요.","warning":"간식은 앉아서 먹이고 질식 위험을 꼭 주의하세요.","photo":"https://toppingskids.com/cdn/shop/files/BrownRiceOat_x1_0eac4c1b-1d9a-4350-8dea-b42b9c6747ed_1024x1024.png?v=1707209975","icon":"🍘","url":"https://toppingskids.com/products/jilmajae-organic-brown-rice-oat-stick","type":"product"},{"title":"이유식 재료 장보기 메모","category":"grocery","sub":"이유식 재료","age":["6-12m","12-24m"],"desc":"애호박 대체로 green zucchini를 많이 쓰고, organic 야채나 고기는 CS Fresh, FairPrice Finest, Little Farms를 많이 언급했습니다.","review":"애호박 대신 zucchini를 사용하고 생선은 필렛 형태로 구매한다는 경험이 있었어요.","warning":"제품명보다 원재료 상태, 손질 편의성, 냉장/냉동 여부를 보고 고르는 흐름이 많았습니다.","photo":"","icon":"🥕","url":null,"type":"product"},{"title":"Nosiboo Pro 콧물흡입기","category":"gear","sub":"위생·건강","age":["0-6m","6-12m","12-24m"],"desc":"신생아 시기부터 코 관리에 쓰는 전동 흡입기 제품으로 언급됐어요.","review":"흡입이 편하다는 경험이 있는 반면 기계소리나 흡입감 때문에 아이가 싫어할 수 있다는 의견도 있었어요.","warning":"사용 시 아이에게 맞는 압력·방법은 제품 설명서를 따르세요.","photo":"https://shop.nosiboo.com/cdn/shop/files/nosiboo-pro-nasal-aspirator-for-babies-7939931.jpg?v=1773128211","icon":"💧","url":"https://shop.nosiboo.com/products/nosiboo-pro-nasal-aspirator","type":"product"},{"title":"MamyPoko Air Fit Marshmallow 팬티","category":"gear","sub":"기저귀","age":["6-12m","12-24m"],"desc":"로컬 판매 중인 MamyPoko 팬티형 제품이에요.", cine","sub":"상비약","age":["0-6m","6-12m","12-24m","24m+"],"desc":"한국에서 준비하는 무피로신 성분의 항생제 연고입니다. 싱가포르 판매·처방 기준은 확인이 필요합니다.","review":"한국에서 준비해 왔다는 경험이 있었으며, 현지 약국 구입 가능 여부는 불확실해요.","warning":"영유아 피부 감염이 의심되면 의사에게 진료받으세요. 항생제 연고는 전문가 안내에 따라 사용합니다.","photo":"https://konymart.com/cdn/shop/files/bn1_9c205643-a043-4ef6-89bb-991871e554ad.jpg?v=1754896892","icon":"🧴","url":"https://www.jwbrand.co.kr/sroban/product","type":"medicine"},{"title":"Stérimar Baby Nasal Hygiene Spray 100 mL","category":"medicine","sub":"상비약","age":["0-6m","6-12m","12-24m"],"desc":"영유아용 생리식염수 코세정 스프레이 제품입니다.","review":"코막힘에 생리식염수 스프레이를 사용했다는 경험이 있습니다. 다만 이 브랜드 자체에 대한 별도 사용 후기는 확인되지 않았습니다.","warning":"연령별 사용 방법과 노즐 압력·방향을 확인하세요.","photo":"https://th-test-11.slatic.net/p/43544298bc7d0ad0d96747a03ee8b0f8.jpg","icon":"💧","url":"https://www.watsons.com.sg/sterimar-nasal-hygiene-spray-for-baby-100ml/p/BP_99814","type":"medicine"},{"title":"QV Cream","category":"medicine","sub":"상비약","age":["0-6m","6-12m","12-24m","24m+"],"desc":"보습용 로컬 제품으로 추천이 자주 나온 편입니다.","review":"순하고 흡수가 괜찮다고 느낀 가정이 있었고, 다른 보습제보다 잘 맞았다는 의견도 있었어요.","warning":"진물·악화가 있는 피부에는 보습제만으로 버티지 마세요.","photo":"https://down-my.img.susercontent.com/file/bdc3632ea2ecf62b50887beae06039ca","icon":"🧴","url":"https://woodspharmacy.com.sg/products/qv-cream-500g-pump","type":"medicine"},{"title":"KKH","category":"clinic","sub":"소아과·병원","age":["0-6m","6-12m","12-24m","24m+","parents"],"desc":"소아 응급/전문 진료 병원으로 가장 자주 언급되었습니다. 외래 연계가 좋았다는 후기와 케이스에 따라 불만이었던 후기 모두 있었습니다.","review":"응급 대응과 외래 연계가 만족스러웠다는 경험이 있었지만 진료·행정 과정에 불편을 겪은 경우도 있었어요.","warning":"응급실 경험은 케이스 편차가 큽니다.","photo":"","icon":"🏥","url":null,"type":"place"},{"title":"NUH","category":"clinic","sub":"소아과·병원","age":["0-6m","6-12m","12-24m","24m+","parents"],"desc":"KKH와 함께 소아 진료를 받을 수 있는 대표 병원입니다. 가까운 병원을 선택하는 것이 중요하다는 의견이 있었어요.","review":"KKH와 함께 소아 진료 선택지로 많이 언급됐고 응급 상황에는 거리가 중요한 기준이라는 의견이 있었어요.","warning":"대기 및 행정 경험은 개인차가 큽니다.","photo":"","icon":"🏥","url":null,"type":"place"},{"title":"Aglow @ United Square","category":"clinic","sub":"소아과·병원","age":["0-6m","6-12m","12-24m","24m+"],"desc":"감기가 오래갈 때 약 조정이 괜찮았다는 후기가 있었고, 예약 후 가면 편하다는 팁이 있었습니다.","review":"증상이 지속됐을 때 치료 후 호전을 경험한 사례가 있었고, 예약 후 방문을 권하는 의견이 있었어요.","warning":"의사와 지점에 따라 대기 차이가 있을 수 있습니다.","photo":"","icon":"🩺","url":null,"type":"place"},{"title":"Kinder Clinic (Paragon / Mount E Novena)","category":"clinic","sub":"소아과·병원","age":["0-6m","6-12m","12-24m","24m+"],"desc":"예방접종과 소아 진료 목적으로 자주 언급되었습니다.","review":"접종 응대가 친절했다는 의견과 인기 의사의 대기가 길 수 있다는 경험이 함께 있었어요.","warning":"지점별 제공 백신이 다를 수 있어 확인이 필요합니다.","photo":"","icon":"🩺","url":null,"type":"place"},{"title":"하기스 네이처메이드","category":"gear","sub":"기저귀","age":["0-6m","6-12m","12-24m"],"desc":"가장 많이 나온 기저귀 중 하나지만 호불호가 꽤 갈렸습니다. 낮에 쓰고 밤에는 다른 오버나이트로 분리하는 분도 있었습니다.","review":"낮 기저귀로 사용하는 가정이 있었어요. 허리선이 짧게 느껴져 샘이 생긴다는 상반된 후기도 있었어요.","warning":"허리선 짧아서 샌다는 후기가 반복적으로 있었습니다.","photo":"https://media.nedigital.sg/fairprice/fpol/media/images/product/XL/13146374_XL1_20220224.jpg","icon":"🩲","url":null,"type":"product"},{"title":"하기스 네이처메이드 오버나이트","category":"gear","sub":"기저귀","age":["6-12m","12-24m"],"desc":"야간 샘 방지용으로 따로 쓰는 경우가 보였습니다.","review":"낮·밤 기저귀를 나눠 사용하는 가정이 있었지만, 밤에 새어 중간에 교체한다는 사례도 있었어요.","warning":"아이의 자세/체형에 따라 샘 여부는 차이가 있습니다.","photo":"https://cdnv2.tgdd.vn/pim/cdn/images/202603/ta-quan-huggies-nature-made-overnite-size-m-58-mieng-6-11kg-thumb134354.jpg","icon":"🌙","url":null,"type":"product"},{"title":"Pampers Premium Care","category":"gear","sub":"기저귀","age":["0-6m","6-12m","12-24m"],"desc":"얇고 부드럽다는 사용 경험이 있었어요.","review":"팸퍼스는 얇다는 평가, 스킨네이처는 구하기 쉽고 부드럽다는 평가가 있었어요. 다만 일부는 사이즈가 커지면서 샘이 생겼다고 해요.","warning":"L 사이즈 이후 샌다는 후기와 안 샌다는 후기가 혼재했습니다.","photo":"https://down-sg.img.susercontent.com/file/sg-11134207-7rdyi-mcde8f7tzm5c9e","icon":"🧷","url":null,"type":"product"},{"title":"Rascal + Friends 밤기저귀","category":"gear","sub":"기저귀","age":["6-12m","12-24m"],"desc":"싱가포르에서 구할 수 있는 밤기저귀 후보 중 하나입니다. 낮에는 Pampers, 밤에는 Rascal + Friends를 쓴다는 구체적인 조합 후기가 있었습니다.","review":"","warning":"흡수력과 샘은 체형·수면 자세에 따라 다릅니다.","photo":"https://down-sg.img.susercontent.com/file/sg-11134201-7rd4m-m7uskwz3hvf1d0","icon":"💙","url":"https://www.rascalsbaby.com/en-sg/products/premium-diapers","type":"product"},{"title":"Merries Premium","category":"gear","sub":"기저귀","age":["0-6m","6-12m","12-24m"],"desc":"부드럽다고 호평한 부모도 있지만, 샌다는 상반된 후기도 있습니다.","review":"","warning":"사이즈와 허벅지/허리 핏을 우선 비교해 보세요.","photo":"https://media.nedigital.sg/fairprice/fpol/media/images/product/XL/13234916_XL1_20240514.jpg","icon":"🧷","url":"https://www.fairprice.com.sg/product/da-merries-first-premium-tape-s-60s-13234916","type":"product"},{"title":"Doona","category":"gear","sub":"유모차","age":["0-6m","6-12m"],"desc":"차 없이 아기 데리고 이동할 때 많이 언급된 장비입니다.","review":"","warning":"그랩 카시트는 더 큰 아이 기준인 경우가 있어 초기엔 별도 준비가 필요하다는 의견이 있었습니다.","photo":"","icon":"🚗","url":null,"type":"product"},{"title":"Bugaboo Dragonfly","category":"gear","sub":"유모차","age":["0-6m","6-12m","12-24m"],"desc":"싱가포르에서 절충형/도심형으로 만족도가 높아 보였던 모델입니다.","review":"한 손 접기와 양대면 기능이 택시 이동에 편리했다는 경험이 있었어요.","warning":"인기 많아서 예약 배송이었다는 후기가 있었습니다.","photo":"https://www.bugaboo.com/dw/image/v2/BDLP_PRD/on/demandware.static/-/Sites-bugaboo-master/default/dw7ca3e99f/images/PV006877/Bugaboo-Seat-Stroller-black-chassis-midnight-black-fabrics-misty-white-sun-canopy-x-PV006877-01.jpg?sfrm=png&sw=3000","icon":"🛺","url":null,"type":"product"},{"title":"Stokke YOYO3","category":"gear","sub":"유모차","age":["6-12m","12-24m","24m+"],"desc":"대중교통·비행기 여행에서 휴대성이 언급된 모델이에요.","review":"여행 때 YOYO를 휴대하고 기내 선반에 보관했다는 경험과, 이동 동선의 계단이 번거로웠다는 후기가 있었어요.","warning":"휴대용은 신생아/초기 개월에 안정감에 대한 걱정이 함께 나왔습니다.","photo":"https://www.mothercare.com.sg/site/Product%20Images/kit-447740_3.jpg","icon":"✈️","url":null,"type":"product"},{"title":"Silver Cross Dune","category":"gear","sub":"유모차","age":["0-6m","6-12m","12-24m"],"desc":"디럭스보다 가벼운 절충형으로 사용했다는 경험이 있어요.","review":"Dune을 돌 전까지 편하게 썼다는 경험이 있었고 무게 부담을 고려하라는 의견이 있었어요.","warning":"싱가포르에서는 엘리베이터, 택시, 몰 이동 때문에 무게 체감이 크 baby.com/cdn/shop/files/shnuggle-newborn-baby-bath-with-plug-pebble-grey_image_1_1200x628_crop_center.jpg?v=1769340652","url":"https://www.macrobaby.com/products/shnuggle-newborn-baby-bath-with-plug-pebble-grey","icon":"🛁","type":"product"},{"title":"Thomson Paediatric Centre | Kids Clinic @ Woodleigh — Dr Grace Lim","category":"clinic","sub":"소아과","age":["0-6m","6-12m","12-24m","24m+","parents"],"desc":"Woodleigh에 있는 Dr Grace Lim 선생님의 소아과입니다. 세심한 상담을 원하는 가족이 참고할 수 있는 병원이에요.","review":"여의사 선생님이 친절하고 아이의 상태를 매우 꼼꼼하게 진료해 주셔서 계속 방문하고 있다는 만족 후기가 있습니다.","warning":"진료시간과 예약 가능 여부는 방문 전에 확인하세요.","photo":"","icon":"🩺","url":"https://maps.app.goo.gl/aFsAvaRv2tmMNUGh8","type":"place"}],"fruit":[{"title":"6개월 전후 · 처음 시작","text":"이유식 준비가 된 아기에게 부드럽게 으깬 바나나, 익힌 사과·배, 아보카도를 시도할 수 있어요.","fruit":["🍌 바나나","🍎 사과","🍐 배","🥑 아보카도"],"minAge":6},{"title":"6개월 이후 · 종류 확장","text":"딸기·블루베리·복숭아·망고도 안전한 질감으로 준비하면 도입할 수 있어요. 특정 과일별 시작 월령은 정해져 있지 않아요.","fruit":["🍓 딸기","🫐 블루베리","🍑 복숭아","🥭 망고"],"minAge":6},{"title":"입자·씹기 발달에 따라","text":"키위·파파야·용과·멜론도 아이의 먹는 능력에 맞춰 작게 손질해 주세요.","fruit":["🥝 키위","🍈 멜론","🐉 용과","🍈 파파야"],"minAge":6},{"title":"계속 지켜야 할 안전 수칙","text":"포도와 통블루베리 등 둥근 과일은 반드시 적절히 잘라 제공하고, 딱딱한 과일 조각과 씨는 피하세요.","fruit":["🍇 포도","🫐 블루베리","🍒 체리","🍎 사과"],"minAge":6}]};

const FRUIT_EMOJI={'바나나':'🍌','사과':'🍎','배':'🍐','아보카도':'🥑','망고':'🥭','딸기':'🍓','복숭아':'🍑','블루베리':'🫐','키위':'🥝','파파야':'🍈','멜론':'🍈','용과':'🐉','귤':'🍊','수박':'🍉','포도':'🍇','체리':'🍒','자두':'🍑'};
let monthSelected=6;
const FRUIT_PREP={
'바나나':['껍질을 벗겨 잘 익은 과육을 으깨거나 길쭉하고 부드러운 조각으로 제공하세요.','덜 익어 단단한 조각은 피하세요.'],
'사과':['처음에는 껍질을 벗겨 찌고 으깨세요. 씹기 능력이 자라면 매우 얇은 조각으로 제공하세요.','생사과의 단단한 큐브·두꺼운 조각은 질식 위험이 있습니다.'],
'배':['초기에는 찌거나 곱게 갈아 제공하세요. 이후에는 아주 부드럽고 얇게 썰어주세요.','단단하고 미끄러운 덩어리는 피하세요.'],
'아보카도':['잘 익은 과육을 으깨거나 잡기 쉬운 부드러운 조각으로 제공하세요.','크고 미끄러운 덩어리는 먹기 어려울 수 있습니다.'],

'블루베리':['통째로 주지 말고 손가락으로 납작하게 눌러 으깨거나 잘게 자르세요.','동그란 통블루베리는 질식 위험이 있습니다.'],
'키위':['껍질을 벗겨 잘 익은 과육을 작은 부드러운 조각으로 제공하세요.','산도 때문에 입가가 붉어질 수 있습니다. 부기·호흡곤란 등은 알레르기 신호일 수 있어요.'],
'파파야':['껍질과 씨를 제거하고 익은 과육을 으깨거나 얇게 썰어주세요.','씨는 완전히 제거하세요.'],
'멜론':['껍질·씨를 제거하고 충분히 익은 부드러운 부분을 얇게 썰어주세요.','멜론볼·단단하고 둥근 덩어리는 피하세요.'],
'용과':['껍질을 벗겨 잘 익은 과육을 으깨거나 작은 부드러운 조각으로 제공하세요.','매우 미끄러울 수 있어 한 번에 큰 덩어리를 주지 마세요.'],
'귤':['껍질과 씨, 질긴 속껍질을 필요에 따라 제거해 잘게 나눠주세요.','산도 때문에 입 주변이 자극받을 수 있습니다.'],
'수박':['씨와 두꺼운 껍질을 제거하고 작고 부드러운 조각으로 제공하세요.','미끄러운 큰 조각과 씨에 주의하세요.'],

'체리':['꼭지와 씨를 완전히 제거하고 작게 자르거나 으깨세요.','씨가 남거나 둥근 통째인 체리는 위험합니다.'],
'자두':['씨를 완전히 제거하고 잘 익은 과육을 얇게 잘라주세요.','껍질과 단단한 과육은 씹는 능력에 맞춰 처리하세요.']
};
function fruitInfo(name){return FRUIT_PREP[name]||['잘 익은 과육을 씹는 능력에 맞춰 부드럽고 안전한 모양으로 제공하세요.','단단하고 둥근 조각, 씨와 질긴 껍질에 주의하세요.']}
function renderFruits(){
 const m=monthSelected,f=MONTHLY_FRUITS[m];
 const months=Array.from({length:19},(_,i)=>i+6).map(n=>'<button type="button" class="'+(m===n?'active':'')+'" data-month="'+n+'">'+n+'개월</button>').join('');
 const cards=f.names.map(n=>{const p=fruitInfo(n),icon=FRUIT_EMOJI[n]||'🍎';return '<article class="fruit-prep-card"><span class="fruit-em">'+icon+'</span><div><b>'+e(n)+'</b><p>'+e(p[0])+'</p><div class="fruit-risk">주의 · '+e(p[1])+'</div></div></article>'}).join('');
 $('#fruits').innerHTML='<div style="grid-column:1/-1"><div class="monthbar">'+months+'</div><div class="month-detail"><div class="month-main"><h3>'+m+'개월 과일 가이드</h3><p>'+e(f.tip)+'</p><div class="fruit-prep-grid">'+cards+'</div><div class="fruit-main-note">특정 과일을 반드시 '+m+'개월에 시작해야 한다는 뜻은 아닙니다. 6개월 무렵 준비가 되면 다양한 과일을 발달에 맞는 질감으로 제공할 수 있습니다.</div></div><div class="month-safety"><h3>이번 월령에 특히 확인할 점</h3><ul>'+f.warnings.map(w=>'<li>'+e(w)+'</li>').join('')+'<li>아이는 앉은 자세에서 보호자가 지켜보는 가운데 먹어야 합니다.</li></ul><a class="go" href="https://www.healthhub.sg/well-being-and-lifestyle/pregnancy-and-infant-health/baby-getting-ready-for-solids" target="_blank" rel="noopener">싱가포르 공식 이유식 가이드 ↗</a> <a class="go" href="https://www.cdc.gov/infant-toddler-nutrition/foods-and-drinks/choking-hazards.html" target="_blank" rel="noopener">질식 위험 음식 가이드 ↗</a></div></div></div>';
 document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{monthSelected=Number(b.dataset.month);renderFruits()});
 $('#disclaimer').textContent='과일별 손질·주의 정보는 일반적인 영유아 식품 안전 자료를 바탕으로 하며, 진료나 개별 알레르기 상담을 대신하지 않습니다.';
}

const PREP_GROUPS={
'잠깐 외출':['기저귀 여분 3~5개','휴대용 물티슈','기저귀 갈이 패드','여벌 옷 1벌','손수건·거즈','분유/수유 준비물','젖병 또는 물컵','아기 간식 또는 이유식','방수 턱받이','지퍼백/쓰레기봉투','모자·유모차 선쉐이드','아기띠 또는 유모차','휴대용 체온계(필요 시)'],
'비행기 탑승':['여권·입국 서류','항공권·체크인 정보','기내 반입용 기저귀·물티슈','여벌 옷(아기 + 보호자)','분유·젖병·수유용 물','필요한 이유식·간식','먹이는 동안 쓸 턱받이','쪽쪽이/치발기','작은 장난감·그림책','얇은 담요·수면조끼','지퍼백·오염물 봉투','상비약과 처방 자료','유모차 위탁/기내 반입 확인','카시트·공항 이동 수단 확인'],
'여행·1박 이상':['여행 일정·숙소 예약','여권·비자·보험','기저귀 사용량 + 여분','분유·젖병·세척도구','이유식·간편식·간식','휴대용 이유식 스푼','유아용 컵·턱받이','세탁용 작은 봉투','평소 쓰는 로션·클렌저','목욕 타월·가제 손수건','여벌 옷·잠옷','낮잠용 익숙한 물품','체온계·필요한 약','유모차·아기띠','충전기·변환 플러그','현지 의료기관 위치 확인'],
};
let prepSelected='잠깐 외출';
function prepKey(){return 'sg-baby-checklist-v1:'+prepSelected}
function prepSaved(){try{return JSON.parse(localStorage.getItem(prepKey())||'[]')}catch{return []}}
function renderPrep(){let saved=prepSaved(),items=PREP_GROUPS[prepSelected];$('#prepPanel').innerHTML=`<div class="prep-tabs">${Object.keys(PREP_GROUPS).map(k=>`<button class="${prepSelected===k?'active':''}" data-prep="${e(k)}">${e(k)}</button>`).join('')}</div><div class="prep-progress"><b>준비 완료 ${saved.length} / ${items.length}</b><button id="prepReset">초기화</button></div><div class="prep-list">${items.map((item,i)=>`<label class="prep-check ${saved.includes(i)?'done':''}"><input type="checkbox" data-check="${i}" ${saved.includes(i)?'checked':''}><span>${e(item)}</span></label>`).join('')}</div><div class="source-note">체크 상태는 현재 기기 브라우저에 저장되며 다른 기기와 자동 동기화되지 않습니다.</div>`;
 document.querySelectorAll('[data-prep]').forEach(b=>b.onclick=()=>{prepSelected=b.dataset.prep;renderPrep()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{const v=prepSaved();const i=Number(b.dataset.check);const next=b.checked?[...new Set([...v,i])]:v.filter(x=>x!==i);localStorage.setItem(prepKey(),JSON.stringify(next));renderPrep()});$('#prepReset').onclick=()=>{localStorage.removeItem(prepKey());renderPrep()};}
function renderBenefit(){
 $('#benefitPanel').innerHTML='<div class="benefit-card"><h3>🇰🇷 부모급여 계산기</h3><p>출생월과 출입국 날짜를 입력하면 월별 수급 예상과 입국 일정 계산을 바로 확인할 수 있어요.</p><iframe title="부모급여 계산기" src="./planner/" class="planner-frame" loading="lazy"></iframe><small>계산 결과는 예상치입니다. 실제 지급 여부는 담당 기관에 확인해 주세요. 온라인 동기화 기능은 제공하지 않습니다.</small></div>';
}
const REC_CATEGORIES=[["grocery","장보기"],["gear","육아용품"],["outing","가볼만한 곳"],["clinic","병원·소아과"],["medicine","상비약"],["preschool","어린이집·교육"],["living","생활 정보"]];
async function renderRecommendations(){
 const node=$('#recPanel');node.innerHTML='<div class="rec-layout"><div class="rec-formbox"><h3>💌 추천 글 남기기</h3><p>좋았던 제품이나 장소, 유용한 정보를 간단히 공유해 주세요.</p><form id="recForm"><label>카테고리<select name="category" required>'+REC_CATEGORIES.map(([v,n])=>'<option value="'+v+'">'+n+'</option>').join('')+'</select></label><label>닉네임<input name="nickname" maxlength="24" minlength="2" required placeholder="예: 토끼맘"></label><label>제품 또는 장소 이름<input name="title" maxlength="90" required placeholder="예: Mustela 로션"></label><label>추천 링크 (선택)<input name="url" type="url" maxlength="600" placeholder="https://..."></label><label>추천하는 이유<textarea name="reason" rows="4" maxlength="400" minlength="8" required placeholder="어떤 점이 좋았는지 알려주세요"></textarea></label><input name="website" class="honeypot" tabindex="-1" autocomplete="off"><button type="submit">추천 글 올리기</button><p class="source-note">글은 공개될 수 있으니 이름, 연락처, 아이의 개인정보는 적지 마세요.</p><div id="recStatus" aria-live="polite"></div></form></div><div class="rec-listbox"><h3>함께 모은 추천</h3><div id="recItems">추천 글을 불러오는 중입니다…</div></div></div>';
 const form=$('#recForm');form.onsubmit=async ev=>{ev.preventDefault();const btn=form.querySelector('button[type=submit]');btn.disabled=true;$('#recStatus').textContent='등록 중…';const data=Object.fromEntries(new FormData(form));try{const res=await fetch('/api/recommendations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await res.json();if(!res.ok)throw Error(j.error||'등록하지 못했습니다.');$('#recStatus').textContent='추천 글이 등록되었습니다.';form.reset();loadRecommendations()}catch(err){$('#recStatus').textContent=err.message}finally{btn.disabled=false}};
 loadRecommendations();
}
async function loadRecommendations(){const out=$('#recItems');try{const res=await fetch('/api/recommendations');const j=await res.json();if(!res.ok)throw Error(j.error||'불러올 수 없습니다.');out.innerHTML=(j.items||[]).map(p=>'<article class="rec-post"><span>'+e(REC_CATEGORIES.find(([c])=>c===p.category)?.[1]||'추천')+'</span><h4>'+e(p.title)+'</h4><div class="rec-post-by">작성자 · '+e(p.nickname||'익명')+'</div><p>'+e(p.reason)+'</p>'+(p.url?'<a href="'+e(p.url)+'" target="_blank" rel="nofollow noopener noreferrer">자세히 보기 ↗</a>':'')+'</article>').join('')||'<p class="empty">아직 등록된 추천 글이 없어요. 첫 번째 추천을 남겨주세요.</p>'}catch(err){out.innerHTML='<p class="empty">'+e(err.message)+'</p>';}}
mountCats();if(['grocery','clinic','medicine','gear','outing','preschool','fruit','living','prep','benefit','recommendations'].includes(location.hash.slice(1)))openCategory(location.hash.slice(1));
</script>
