const DATA={"records":[{"title":"Organic Valley Baby Swiss","category":"grocery","sub":"치즈","age":["12-24m","24m+"],"desc":"아기 치즈 대안으로 가장 구체적으로 언급된 제품 중 하나입니다. 자연치즈라는 점 때문에 찾는 분이 있었습니다.","review":"잘 먹는다는 의견이 있었지만 나트륨 때문에 한 번에 주는 양을 조절하는 가정도 있었어요.","warning":"치즈류는 나트륨이 있을 수 있어 양 조절이 필요하다는 의견이 있었습니다.","photo":"https://cdn.sanity.io/images/5dqbssss/production-v3/9922cee523035184752ab5c1bd06ae343b800aa1-2000x1882.png","icon":"🧀","url":"https://www.fairprice.com.sg/product/organic-valley-cheese-slices-baby-swiss-170g-8-per-pack-13074065","type":"product"},{"title":"Arla Natural Mozzarella Block 200g","category":"grocery","sub":"치즈","age":["12-24m","24m+"],"desc":"현지 판매되는 Arla 모차렐라 제품으로, 커뮤니티에서 언급된 Arla 브랜드의 여러 품목 중 하나예요.","review":"추천받아 사용한 가정이 있었어요. 치즈와 우유가 함께 언급된 브랜드예요.","warning":"같은 브랜드 안에서도 제품 종류가 많으니 무가당/가공 여부를 확인해 주세요.","photo":"https://shopsuki.ph/cdn/shop/files/102062329_1024x.jpg?v=1769134431","icon":"🧀","url":"https://coldstorage.com.sg/product/arla-mozzarella-block-200g","type":"product"},{"title":"Tamar Valley Greek Style Yoghurt","category":"grocery","sub":"요거트","age":["6-12m","12-24m","24m+"],"desc":"KK 병원 영양사 상담 때 언급되었다는 후기와 실제로 먹이고 있다는 후기가 있었습니다.","review":"영양상담을 계기로 선택했다는 경험과 꾸준히 먹이고 있다는 후기가 있었어요.","warning":"플레인/과일맛이 섞여 있으니 무가당인지 확인하세요.","photo":"https://assets.woolworths.com.au/images/1005/922679.jpg?h=600&impolicy=wowsmkqiema&w=600","icon":"🥣","url":"https://www.woolworths.com.au/shop/productdetails/922679/tamar-valley-dairy-greek-style-yoghurt","type":"product"},{"title":"Jalna Greek Yoghurt","category":"grocery","sub":"요거트","age":["6-12m","12-24m","24m+"],"desc":"여러 제품을 시도해 본 뒤 아이가 가장 잘 먹었다는 후기가 있었습니다.","review":"여러 플레인 요거트를 시도한 뒤 아기가 가장 잘 먹은 제품이라는 경험이 있었어요.","warning":"플레인 제품인지 꼭 확인하세요.","photo":"https://mcos.coldstorage.com.sg/uploads/product/17610/005017353.jpg?v=1775764275","icon":"🥣","url":"https://coldstorage.com.sg/product/jalna-yoghurt-greek-style-1kg","type":"product"},{"title":"Lurpak Unsalted Butter 250g","category":"grocery","sub":"버터", 었습니다.","review":"콧물이나 코딱지 관리에 스프레이와 소포장 식염수를 준비하는 가정이 있었어요.","warning":"호흡곤란, 수유량 감소가 동반되면 병원으로 가세요.","photo":"","icon":"💧","url":null,"type":"medicine"},{"title":"QV Cream","category":"medicine","sub":"상비약","age":["0-6m","6-12m","12-24m","24m+"],"desc":"보습용 로컬 제품으로 추천이 자주 나온 편입니다.","review":"순하고 흡수가 괜찮다고 느낀 가정이 있었고, 다른 보습제보다 잘 맞았다는 의견도 있었어요.","warning":"진물·악화가 있는 피부에는 보습제만으로 버티지 마세요.","photo":"https://eshop.nurse.org.hk/media/catalog/product/cache/d6274d7662c8a3285d47fb54dcba8ac3/0/6/060291-01.jpg","icon":"🧴","url":"https://woodspharmacy.com.sg/products/qv-cream-500g-pump","type":"medicine"},{"title":"KKH","category":"clinic","sub":"소아과·병원","age":["0-6m","6-12m","12-24m","24m+","parents"],"desc":"소아 응급/전문 진료 병원으로 가장 자주 언급되었습니다. 외래 연계가 좋았다는 후기와 케이스에 따라 불만이었던 후기 모두 있었습니다.","review":"응급 대응과 외래 연계가 만족스러웠다는 경험이 있었지만 진료·행정 과정에 불편을 겪은 경우도 있었어요.","warning":"응급실 경험은 케이스 편차가 큽니다.","photo":"","icon":"🏥","url":null,"type":"place"},{"title":"NUH","category":"clinic","sub":"소아과·병원","age":["0-6m","6-12m","12-24m","24m+","parents"],"desc":"KKH와 함께 소아 진료를 받을 수 있는 대표 병원입니다. 가까운 병원을 선택하는 것이 중요하다는 의견이 있었어요.","review":"KKH와 함께 소아 진료 선택지로 많이 언급됐고 응급 상황에는 거리가 중요한 기준이라는 의견이 있었어요.","warning":"대기 및 행정 경험은 개인차가 큽니다.","photo":"","icon":"🏥","url":null,"type":"place"},{"title":"Aglow @ United Square","category":"clinic","sub":"소아과·병원","age":["0-6m","6-12m","12-24m","24m+"],"desc":"감기가 오래갈 때 약 조정이 괜찮았다는 후기가 있었고, 예약 후 가면 편하다는 팁이 있었습니다.","review":"증상이 지속됐을 때 치료 후 호전을 경험한 사례가 있었고, 예약 후 방문을 권하는 의견이 있었어요.","warning":"의사와 지점에 따라 대기 차이가 있을 수 있습니다.","photo":"","icon":"🩺","url":null,"type":"place"},{"title":"Kinder Clinic (Paragon / Mount E Novena)","category":"clinic","sub":"소아과·병원","age":["0-6m","6-12m","12-24m","24m+"],"desc":"예방접종과 소아 진료 목적으로 자주 언급되었습니다.","review":"접종 응대가 친절했다는 의견과 인기 의사의 대기가 길 수 있다는 경험이 함께 있었어요.","warning":"지점별 제공 백신이 다를 수 있어 확인이 필요합니다.","photo":"","icon":"🩺","url":null,"type":"place"},{"title":"하기스 네이처메이드","category":"gear","sub":"기저귀","age":["0-6m","6-12m","12-24m"],"desc":"가장 많이 },{"title":"Doona","category":"gear","sub":"유모차","age":["0-6m","6-12m"],"desc":"차 없이 아기 데리고 이동할 때 많이 언급된 장비입니다.","review":"","warning":"그랩 카시트는 더 큰 아이 기준인 경우가 있어 초기엔 별도 준비가 필요하다는 의견이 있었습니다.","photo":"","icon":"🚗","url":null,"type":"product"},{"title":"Bugaboo Dragonfly","category":"gear","sub":"유모차","age":["0-6m","6-12m","12-24m"],"desc":"싱가포르에서 절충형/도심형으로 만족도가 높아 보였던 모델입니다.","review":"한 손 접기와 양대면 기능이 택시 이동에 편리했다는 경험이 있었어요.","warning":"인기 많아서 예약 배송이었다는 후기가 있었습니다.","photo":"https://www.bugaboo.com/dw/image/v2/BDLP_PRD/on/demandware.static/-/Sites-bugaboo-master/default/dw7ca3e99f/images/PV006877/Bugaboo-Seat-Stroller-black-chassis-midnight-black-fabrics-misty-white-sun-canopy-x-PV006877-01.jpg?sfrm=png&sw=3000","icon":"🛺","url":null,"type":"product"},{"title":"Stokke YOYO3","category":"gear","sub":"유모차","age":["6-12m","12-24m","24m+"],"desc":"대중교통·비행기 여행에서 휴대성이 언급된 모델이에요.","review":"여행 때 YOYO를 휴대하고 기내 선반에 보관했다는 경험과, 이동 동선의 계단이 번거로웠다는 후기가 있었어요.","warning":"휴대용은 신생아/초기 개월에 안정감에 대한 걱정이 함께 나왔습니다.","photo":"https://www.mothercare.com.sg/site/Product%20Images/kit-447740_3.jpg","icon":"✈️","url":null,"type":"product"},{"title":"Silver Cross Dune","category":"gear","sub":"유모차","age":["0-6m","6-12m","12-24m"],"desc":"디럭스보다 가벼운 절충형으로 사용했다는 경험이 있어요.","review":"Dune을 돌 전까지 편하게 썼다는 경험이 있었고 무게 부담을 고려하라는 의견이 있었어요.","warning":"싱가포르에서는 엘리베이터, 택시, 몰 이동 때문에 무게 체감이 크다는 흐름이 있었습니다.","photo":"https://www.silvercrossbaby.jp/html/upload/save_image/Stone_02.jpg","icon":"🌿","url":"https://www.silvercrossbaby.jp/products/detail/49","type":"product"},{"title":"Singapore Oceanarium","category":"outing","sub":"장소","age":["6-12m","12-24m","24m+"],"desc":"실내 나들이 장소로 자주 언급되었습니다. 헤이즈나 더운 날에 가기 좋다는 톤이 있었습니다.","review":"자주 방문하는 실내 나들이 장소로 언급됐어요.","warning":"시즌권 가성비는 자주 가는지에 따라 갈립니다.","photo":"https://dam.mediacorp.sg/image/upload/s--q7J365Sc--/c_fill%2Cg_auto%2Ch_523%2Cw_693/f_auto%2Cq_auto/v1/mediacorp/cna/image/2025/07/16/oceanarium.jpg?itok=XzjytT1O","icon":"🐠","url":"https://www.rwsentosa.com/en/play {id:'outing',name:'키즈카페 · 나들이',icon:'🛝',sub:'지도 · 지역 · 월령별 추천',desc:'아이와 가볼 만한 곳'},
{id:'preschool',name:'어린이집 · 교육',icon:'🏫',sub:'유치원 · Infant Care · PG',desc:'입학 전 알아둘 것'},
{id:'fruit',name:'월령별 과일',icon:'🍓',sub:'시작 시기 · 안전한 제공 방법',desc:'이유식 과일 가이드'},
{id:'living',name:'싱가포르 생활',icon:'🏡',sub:'비자 · 예방접종 · 헬퍼',desc:'실생활에 필요한 공식 안내'}];
const labels={all:'전체', '0-6m':'0–6개월','6-12m':'6–12개월','12-24m':'12–24개월','24m+':'24개월 이상',parents:'부모/공통'};
const regionNames={All:'전체 지역',Central:'Central',East:'East',West:'West',North:'North',South:'South',Unknown:'기타'};
const state={category:null,sub:'전체',age:'all',region:'All',kind:'전체',search:'',rating:'전체'};let map=null,markerLayer=null;
const $=(s)=>document.querySelector(s);const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mountCats(){ $('#categories').innerHTML=categories.map(x=>`<button class="category ${state.category===x.id?'selected':''}" data-cat="${x.id}"><span class="cat-art">${x.icon}</span><b>${e(x.name)}</b><small>${e(x.sub)}</small></button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>openCategory(b.dataset.cat));}
function openCategory(id){const cat=categories.find(c=>c.id===id);if(!cat)return;Object.assign(state,{category:id,sub:'전체',age:'all',region:'All',kind:'전체',search:'',rating:'전체'});history.replaceState(null,'','#'+id);mountCats();$('#sectionTitle').textContent=cat.icon+' '+cat.name;$('#sectionDescription').textContent=cat.desc;$('#detail').classList.add('visible');$('#detail').scrollIntoView({behavior:'smooth',block:'start'});render();}
$('#backHome').onclick=()=>{state.category=null;history.replaceState(null,'',location.pathname);$('#detail').classList.remove('visible');mountCats();window.scrollTo({top:0,behavior:'smooth'})};
function getSubset(){return DATA.records.filter(x=>x.category===state.category)}
function ageMatch(x){if(state.age==='all'||state.age==='parents')return true;if(x.category==='outing'){const max={'0-6m':5,'6-12m':11,'12-24m':23,'24m+':90}[state.age];return (x.minAge??0)<=max}return (x.age||[]).includes(state.age)}
function filterRecords(){return getSubset().filter(x=>{let needle=(x.title+' '+x.desc+' '+x.review+' '+x.sub+' '+(x.address||'')).toLowerCase();return (state.sub==='전체'||x.sub===state.sub)&&ageMatch(x)&&(state.region==='All'||x.region===state.region)&&(state.kind==='전체'||x.kind===state.kind)&&(state.rating==='전체'||x.status===state.rating)&&(!state.search||needle.includes(state.search.toLowerCase()))})}
function imageMarkup(x){return x.photo?`<img src="${e(x.photo)}" alt="${e(x.title)} 제품 또는 장소 사진" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="fallback" style="display:none">${x.icon||'🧸'}<span>이미지 준비 중</span></div>`:`<div class="fallback">${x.icon||'🧸'}<span>이미지 준비 중</span></div>`}
function cardHTML(x){const isProduct=['gear','grocery'].includes(x.category), badge=x.status==='bad'?'비추천 후기':x.status==='good'?'방문 추천':null;
return `<article class="product"><div class="visual">${imageMarkup(x)}${badge?`<span class="flag ${x.status}">${badge}</span>`:''}</div><div class="product-body"><div class="subline">${e(x.sub)} ${x.category==='gear'?'· '+e((x.age||[]).filter(a=>a!=='parents').map(a=>labels[a]).join('/')):''}</div><h3>${e(x.title)}</h3><p>${e(x.desc)}</p>${x.review?`<div class="review"><strong>사용 후기 요약</strong>${e(x.review)}</div>`:''}${x.warning&&state.category==='medicine'?`<div class="note">${e(x.warning)}</div>`:''}${x.url?`<a class="go" href="${e(x.url)}" target="_blank" rel="noopener noreferrer">${state.category==='living'?'관련 공식 안내':'제품·상세 정보'} ↗</a>`:''}</div></article>`}
function renderToolbar(){let opts=['<input id="search" class="search" type="search" placeholder="이 카테고리에서 검색" aria-label="검색어">'];
if(['grocery','gear','outing','clinic','preschool','medicine','fruit'].includes(state.category))opts.push('<select id="age" aria-label="아이 월령">'+Object.entries(labels).map(([v,t])=>`<option value="${v}" ${state.age===v?'selected':''}>${t}</option>`).join('')+'</select>');
if(state.category==='outing'){
 opts.push('<select id="region" aria-label="지역 선택">'+Object.entries(regionNames).filter(([v])=>v!=='Unknown').map(([v,t])=>`<option value="${v}" ${v===state.region?'selected':''}>${t}</option>`).join('')+'</select>');
 opts.push('<select id="rating" aria-label="추천 여부"><option value="전체">추천 + 비추천</option><option value="good" '+(state.rating==='good'?'selected':'')+'>추천만</option><option value="bad" '+(state.rating==='bad'?'selected':'')+'>비추천만</option></select>');
}
$('#toolbar').innerHTML=opts.join('');$('#search').value=state.search;$('#search').oninput=ev=>{state.search=ev.target.value;renderContent()};if($('#age'))$('#age').onchange=ev=>{state.age=ev.target.value;renderContent()};if($('#region'))$('#region').onchange=ev=>{state.region=ev.target.value;renderContent()};if($('#rating'))$('#rating').onchange=ev=>{state.rating=ev.target.value;renderContent()};}
function renderSub(){if(state.category==='fruit'||state.category==='living'){ $('#subnav').innerHTML='';return}let subs=state.category==='outing'?['전체','관람·체험','실내 놀이터','야외','식당']:[...new Set(getSubset().map(x=>x.sub))];if(state.category==='outing'){
 $('#subnav').innerHTML=subs.map(v=>`<button ${state.kind===v?'class="on"':''} data-s="${e(v)}">${e(v)}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state.kind=b.dataset.s;renderSub();renderContent()});
}else{if(!subs.includes('전체'))subs.unshift('전체');$('#subnav').innerHTML=subs.map(v=>`<button ${state.sub===v?'class="on"':''} data-s="${e(v)}">${e(v)}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state.sub=b.dataset.s;renderSub();renderContent()})}}
function render(){renderSub();renderToolbar();renderContent()}
function renderContent(){const cat=state.category;$('#outings').classList.toggle('hide',cat!=='outing');$('#fruits').classList.toggle('hide',cat!=='fruit');$('#cards').classList.toggle('hide',cat==='outing'||cat==='fruit');if(cat==='outing'){renderPlaces();return}if(cat==='fruit'){renderFruits();return}const arr=filterRecords();$('#cards').innerHTML=arr.length?arr.map(cardHTML).join(''):'<div class="empty">조건에 맞는 정보가 없어요. 필터를 바꿔보세요.</div>';$('#disclaimer').textContent=cat==='medicine'?'의약품의 실제 허가 연령·농도·사용량은 약사 또는 의료진에게 확인해 주세요.':cat==='living'?'신청 조건과 규정은 변경될 수 있으므로 연결된 정부 기관의 최신 안내를 확인해 주세요.':'방문 후기와 제품 사용감은 개인에 따라 다를 수 있습니다.';}
function renderFruits(){const max={'all':90,'parents':90,'0-6m':5,'6-12m':11,'12-24m':23,'24m+':90}[state.age];const arr=DATA.fruit.filter(x=>x.minAge<=max&&(x.title+x.text+x.fruit.join(' ')).toLowerCase().includes(state.search.toLowerCase()));$('#fruits').innerHTML=arr.map(x=>`<div class="fruit"><h3>${e(x.title)}</h3><div class="icons">${x.fruit.map(f=>`<span title="${e(f)}">${e(f.split(' ')[0])}</span>`).join('')}</div><p>${e(x.fruit.map(f=>f.split(' ').slice(1).join(' ')).join(' · '))}</p><p>${e(x.text)}</p></div>`).join('')||'<div class="empty">해당 월령의 과일 정보가 없어요.</div>';$('#disclaimer').textContent='특정 과일별로 절대적인 시작 월령이 정해져 있지는 않습니다. 이유식 준비 상태와 질식 위험에 맞춰 제공하세요.';}
function initMap(){if(map||!window.L)return;map=L.map('map',{scrollWheelZoom:false}).setView([1.333,103.84],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);markerLayer=L.layerGroup().addTo(map)}
function renderPlaces(){const all=filterRecords();const places=all.filter(p=>p.lat!=null&&p.lng!=null);const unknown=all.filter(p=>p.lat==null||p.lng==null);$('#locations').innerHTML=(places.map((p,i)=>locationHTML(p,i+1))+unknown.map(p=>locationHTML(p,null))).join('')||'<div class="empty">조건에 맞는 장소가 없어요.</div>';
initMap();if(map){markerLayer.clearLayers();const bounds=[];places.forEach((p,i)=>{const n=i+1;const icon=L.divIcon({className:'',html:`<span class="number ${p.status==='bad'?'badpin':''}">${n}</span>`,iconSize:[33,33],iconAnchor:[16,16]});L.marker([p.lat,p.lng],{icon}).addTo(markerLayer).bindPopup(`<strong>${n}. ${e(p.title)}</strong><p style="margin:4px 0">${e(p.address)}</p>`);bounds.push([p.lat,p.lng])});if(bounds.length>1)map.fitBounds(bounds,{padding:[28,28],maxZoom:12});else if(bounds.length===1)map.setView(bounds[0],13);else map.setView([1.333,103.84],11);setTimeout(()=>map.invalidateSize(),100)}$('#disclaimer').textContent='추천 월령은 방문 경험에 기반한 참고 기준이며 시설의 공식 입장 가능 연령과 다를 수 있습니다. 지도상의 핀은 위치 안내용입니다.'}
function locationHTML(x,n){const address=x.address||'위치 확인 필요',desc=x.short||x.review||x.desc;return `<article class="location">${n?`<span class="num ${x.status==='bad'?'bad':''}">${n}</span>`:'<span class="num bad">?</span>'}<div class="location-body"><h3>${e(x.title)}</h3><div class="meta">${e(regionNames[x.region]||x.region)} · ${e(x.kind||'장소')} · ${e(x.minAge||'0')}개월+ 추천 ${x.status==='bad'?'· 비추천 후기':''}</div><p>${e(address)}</p><div class="short">${e(desc)}</div><div class="location-links">${x.url?`<a href="${e(x.url)}" target="_blank" rel="noopener noreferrer">시설 정보 ↗</a>`:''}${n?`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.title+', '+address)}" target="_blank" rel="noopener noreferrer">길찾기 ↗</a>`:''}</div></div>${x.photo?`<img class="place-thumb" loading="lazy" src="${e(x.photo)}" alt="${e(x.title)} 사진" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</article>`}
mountCats();if(['grocery','clinic','medicine','gear','outing','preschool','fruit','living'].includes(location.hash.slice(1)))openCategory(location.hash.slice(1));
</script>
</body></html>
