const label=s=>s==="reference"?"참고자료":s==="community"?"부모들의 언급":"추가 확인 필요";
function cards(items){return items.length?'<div class="list">'+items.map(([r,i])=>'<article class="item"><span class="tag '+(r[4]==="check"?"warn":"")+'">'+label(r[4])+'</span><h3>'+esc(r[1])+'</h3><p>'+esc(r[2])+'</p><div class="actions"><button class="open" data-open="'+i+'">자세히 보기</button><button class="fav" data-fav="'+i+'" aria-label="즐겨찾기">'+(favorites.includes(i)?"★":"☆")+'</button></div></article>').join("")+'</div>':'<div class="empty">해당하는 자료가 없습니다.</div>'}
function render(){hero.classList.toggle("hidden",page==="detail");notice.classList.toggle("hidden",page==="detail");if(page==="detail"){const r=rows[id];main.innerHTML='<button class="back" id="back">← 목록으로</button><section class="detail"><span class="tag '+(r[4]==="check"?"warn":"")+'">'+label(r[4])+'</span><h2>'+esc(r[1])+'</h2><p>'+esc(r[2])+'</p><div class="body">'+esc(r[3])+'</div>'+(r[5]?'<a class="ref" href="'+esc(r[5])+'" target="_blank" rel="noopener noreferrer">공식·참고 사이트 열기 ↗</a>':'')+'<p class="notice">자료 출처와 이용 조건을 확인해 주세요. 의료 자료는 전문 진료를 대신하지 않습니다.</p><button class="topbtn" id="copy">본문 복사</button></section>';document.getElementById("back").onclick=()=>{page="home";render()};document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(r[3]).then(()=>alert("복사되었습니다."));return}
let matches=rows.map((r,i)=>[r,i]).filter(([r,i])=>(page!=="favorites"||favorites.includes(i))&&(category==="all"||r[0]===category)&&(!query||[...r,cats.find(c=>c[0]===r[0])?.[2]].join(" ").toLowerCase().includes(query.toLowerCase())));main.innerHTML='<div class="head"><h2>카테고리</h2><button class="topbtn" id="all">전체 보기</button></div><div class="grid">'+cats.map(c=>'<button class="category '+(category===c[0]?"active":"")+'" data-cat="'+c[0]+'"><span class="emoji">'+c[1]+'</span>'+c[2]+'</button>').join("")+'</div><div class="head"><h2>'+(page==="favorites"?"☆ 저장한 글":category==="all"?"육아 정보 모아보기":cats.find(c=>c[0]===category)[2])+'</h2><span>'+matches.length+'개 자료</span></div>'+cards(matches);document.getElementById("all").onclick=()=>{category="all";page="home";render()};main.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{category=b.dataset.cat;page="home";render()});main.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{id=+b.dataset.open;page="detail";render();window.scrollTo(0,0)});main.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{const i=+b.dataset.fav;favorites=favorites.includes(i)?favorites.filter(x=>x!==i):[...favorites,i];localStorage.setItem(key,JSON.stringify(favorites));render()})}
document.getElementById("search").oninput=e=>{query=e.target.value;page="home";render()};document.getElementById("home").onclick=()=>{page="home";query="";category="all";document.getElementById("search").value="";render()};document.getElementById("favs").onclick=()=>{page="favorites";category="all";query="";document.getElementById("search").value="";render()};render();
</script></body></html>
